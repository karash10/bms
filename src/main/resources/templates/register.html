<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>

        <!-- Server-side error message (shown on full page reload) -->
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- HTMX target for partial response messages -->
        <div id="register-message"></div>

        <form hx-post="/register" hx-target="#register-message" hx-swap="innerHTML">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required
                       placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required
                       placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       minlength="6" placeholder="At least 6 characters">
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role">
                    <option value="USER">User</option>
                    <option value="ADMIN">Admin</option>
                    <option value="ORGANIZER">Organizer</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                <span class="htmx-indicator"><span class="spinner"></span></span>
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a th:href="@{/login}">Sign in here</a>
        </div>
    </div>
</div>

</body>
</html>
