<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-container">
    <div class="auth-card">
        <h2>Sign In</h2>

        <!-- Server-side error message (shown on full page reload) -->
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- HTMX target for partial response messages -->
        <div id="login-message"></div>

        <form hx-post="/login" hx-target="#login-message" hx-swap="innerHTML">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required
                       placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary">
                <span class="htmx-indicator"><span class="spinner"></span></span>
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a th:href="@{/register}">Register here</a>
        </div>
    </div>
</div>

</body>
</html>
