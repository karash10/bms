spring:
  datasource:
    url: jdbc:h2:mem:bms
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,env
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.bms: INFO
    com.bms.service: DEBUG
